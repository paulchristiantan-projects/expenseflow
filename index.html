function table(tx){if(!tx.length)return'<div class="empty">No transactions yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>${tx.map(x=>`<tr><td>${x.date}</td><td>${esc(x.desc)}</td><td><span class="tag">${x.cat}</span></td><td class="amount">${money(x.amount)}</td><td><button class="btn secondary" style="padding:6px 9px" onclick="delTx('${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>`}
function transactions(){return `<div class="card tablecard" style="margin-top:0"><div class="section-title"><h2>Transactions</h2><span>${data().tx.length} records</span></div><div class="filters"><input id="search" placeholder="Search description..."><select id="filterCat"><option value="">All categories</option>${["Food & Dining","Transport","Shopping","Lodging","Bills","Savings","Other"].map(x=>`<option>${x}</option>`).join("")}</select></div><div id="txTable">${table(data().tx.slice().reverse())}</div></div>`}
function others(){let d=data();return `<div class="card" style="margin-top:0"><div class="section-title"><h2>Other expenses</h2><button class="btn primary" onclick="addOther()">＋ Add other expense</button></div><div class="notice">These are kept separate from daily transaction spending and included in the monthly total.</div>${d.others.length?`<div class="tablewrap" style="margin-top:15px"><table><thead><tr><th>Description</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>${d.others.map(x=>`<tr><td>${esc(x.desc)}</td><td class="amount">${money(x.amount)}</td><td><button class="btn secondary" style="padding:6px 9px" onclick="delOther('${x.id}')">Delete</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No other expenses yet.</div>'}</div>`}

function allYearTransactions(year){
  const result=[];
  Object.entries(store.months||{}).forEach(([month,data])=>{
    if(month.slice(0,4)===String(year)){
      (data.tx||[]).forEach(x=>result.push({...x,sourceMonth:month}));
      (data.others||[]).forEach(x=>result.push({...x,date:x.date||month+"-01",sourceMonth:month}));
    }
  });
  return result;
}
function yearSummary(){
  const years=[...new Set(Object.keys(store.months||{}).map(x=>x.slice(0,4)))].filter(Boolean).sort().reverse();
  const year=years[0]||String(new Date().getFullYear());
  const tx=allYearTransactions(year);
  const total=tx.reduce((s,x)=>s+Number(x.amount||0),0);
  const cats={}, months={};
  tx.forEach(x=>{
    const c=/deca payment/i.test(x.desc||"")?"House Payment":(x.cat||cat(x.desc||""));
    cats[c]=(cats[c]||0)+Number(x.amount||0);
    const m=(x.date||x.sourceMonth||"").slice(0,7);
    if(m)months[m]=(months[m]||0)+Number(x.amount||0);
  });
  const rows=Array.from({length:12},(_,i)=>{
    const key=year+"-"+String(i+1).padStart(2,"0");
    return {key,total:months[key]||0,count:tx.filter(x=>(x.date||x.sourceMonth||"").startsWith(key)).length};
  });
  const active=rows.filter(x=>x.total>0), avg=active.length?total/active.length:0;
  const topMonth=[...rows].sort((a,b)=>b.total-a.total)[0];
  const topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const mf=v=>typeof money==="function"?money(v):"₱"+Number(v).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
  const ef=v=>typeof esc==="function"?esc(v):String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const maxM=Math.max(...rows.map(x=>x.total),1), maxC=Math.max(...Object.values(cats),1);
  return `<div class="grid">
    <div class="card kpi"><div class="label">Year total</div><div class="value">${mf(total)}</div><small>${year} • all expenses</small></div>
    <div class="card kpi"><div class="label">Average / active month</div><div class="value">${mf(avg)}</div><small>${active.length} active month${active.length===1?"":"s"}</small></div>
    <div class="card kpi"><div class="label">Highest month</div><div class="value">${topMonth.total?mf(topMonth.total):"—"}</div><small>${new Date(topMonth.key+"-01").toLocaleString("en-US",{month:"long"})}</small></div>
    <div class="card kpi"><div class="label">Top category</div><div class="value">${topCat?ef(topCat[0]):"—"}</div><small>${topCat?mf(topCat[1]):"No data"}</small></div>
  </div>
  <div class="two">
    <div class="card"><div class="section-title"><h2>${year} Monthly Spending</h2><span>${tx.length} records</span></div>
      <div class="bars">${rows.map(x=>`<div class="barwrap"><div class="barvalue">${x.total?mf(x.total):""}</div><div class="bar" style="height:${Math.max(2,Math.round(x.total/maxM*165))}px"></div><div class="barlabel">${new Date(x.key+"-01").toLocaleString("en-US",{month:"short"})}</div></div>`).join("")}</div>
    </div>
    <div class="card"><div class="section-title"><h2>Category Breakdown</h2></div>
      ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="catrow"><span>${ef(c)}</span><div class="track"><div class="fill" style="width:${v/maxC*100}%"></div></div><span class="catamt">${mf(v)}</span></div>`).join("")||'<div class="empty">No expenses yet.</div>'}
    </div>
  </div>
  <div class="card tablecard"><div class="section-title"><h2>Monthly Breakdown</h2><span>${year}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Month</th><th>Transactions</th><th style="text-align:right">Total</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${new Date(x.key+"-01").toLocaleString("en-US",{month:"long",year:"numeric"})}</td><td>${x.count}</td><td class="amount">${mf(x.total)}</td></tr>`).join("")}
    <tr><td><b>Year Total</b></td><td><b>${tx.length}</b></td><td class="amount"><b>${mf(total)}</b></td></tr>
    </tbody></table></div>
  </div>
  <div class="notice"><b>House Payment:</b> Deca Payment is automatically categorized as House Payment.</div>`;
}

function paste(){return `<div class="card" style="margin-top:0"><div class="section-title"><h2>Bulk import</h2><button class="btn primary" id="importBtn">Import transactions</button></div><p style="color:var(--muted);font-size:13px">Paste your original format. The app detects dates and lines like <b>260 - Mototaxi</b>. Lines beginning with “Total:” are ignored because the app calculates totals automatically.</p><textarea id="bulk" style="width:100%;height:390px" placeholder="July 1\n\n55 - Mototaxi\n105 - Lunch\n71 - Mototaxi"></textarea><div class="notice">Tip: You can paste an entire month at once. Dates such as “08/29 - 08/31” are accepted and stored under the first date.</div></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function bind(){document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById("monthSelect").onchange=e=>{month=e.target.value;localStorage.setItem("expenseflow-month",month);render()};document.getElementById("addBtn").onclick=()=>openModal();let imp=document.getElementById("importBtn");if(imp)imp.onclick=importBulk;let search=document.getElementById("search"),fc=document.getElementById("filterCat");if(search){let f=()=>{let q=search.value.toLowerCase(),c=fc.value;document.getElementById("txTable").innerHTML=table(data().tx.slice().reverse().filter(x=>(!q||x.desc.toLowerCase().includes(q))&&(!c||x.cat===c)))};search.oninput=f;fc.onchange=f}}
function openModal(){document.getElementById("modal").classList.add("open");document.getElementById("fDate").value=month+"-01"}
document.getElementById("cancel").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("save").onclick=()=>{let date=document.getElementById("fDate").value,amount=Number(document.getElementById("fAmount").value),desc=document.getElementById("fDesc").value.trim(),c=document.getElementById("fCat").value;if(!date||!amount||!desc)return alert("Please complete the fields.");let m=date.slice(0,7);if(!store.months[m])store.months[m]={tx:[],others:[]};store.months[m].tx.push({id:crypto.randomUUID(),date,amount,desc,cat:c});month=m;save();localStorage.setItem("expenseflow-month",month);document.getElementById("modal").classList.remove("open");render()};
function delTx(id){if(confirm("Delete this transaction?")){data().tx=data().tx.filter(x=>x.id!==id);save();render()}}
function delOther(id){if(confirm("Delete this other expense?")){data().others=data().others.filter(x=>x.id!==id);save();render()}}
function addOther(){let desc=prompt("Description");if(!desc)return;let amount=Number(prompt("Amount (PHP)"));if(!amount)return;data().others.push({id:crypto.randomUUID(),desc,amount});save();render()}
function importBulk(){let text=document.getElementById("bulk").value;let lines=text.split(/\r?\n/),current=null,count=0;for(let raw of lines){let line=raw.trim();if(!line)continue;let dm=line.match(/^(?:July|August|September|October|November|December|January|February|March|April|May|June)\s+(\d{1,2})(?:\s*-\s*(\d{1,2}))?$/i)||line.match(/^(\d{1,2})\/(\d{1,2})(?:\s*-\s*\d{1,2}\/\d{1,2})?$/);if(dm){let s=line.toLowerCase(),mm=s.match(/^([a-z]+)/);let y=2026,mo;if(mm){mo=new Date(Date.parse(mm[1]+" 1, 2026")).getMonth()+1}else{mo=Number(line.split("/")[0])};current=`${y}-${String(mo).padStart(2,"0")}-${String(Number(dm[1])).padStart(2,"0")}`;continue}let em=line.match(/^([\d,]+(?:\.\d+)?)\s*-\s*(.+)$/);if(em&&current){let amount=Number(em[1].replace(/,/g,"")),desc=em[2].trim(),m=current.slice(0,7);if(!store.months[m])store.months[m]={tx:[],others:[]};store.months[m].tx.push({id:crypto.randomUUID(),date:current,amount,desc,cat:cat(desc)});count++}}save();alert(`Imported ${count} transactions.`);month=current?current.slice(0,7):month;localStorage.setItem("expenseflow-month",month);render()}
render();
</script>
</body></html>
